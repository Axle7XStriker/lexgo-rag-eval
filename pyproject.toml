[project]
name = "lexgo-rag-eval"
version = "0.1.0"
description = "Rigorously-evaluated multi-source RAG over MIT 6.006 (Algorithms) + MIT 6.830 (Databases). 4 pipelines, 100 golden Q&As, honest numbers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Aman Bansal" }]

dependencies = [
    "streamlit>=1.40",
    "anthropic>=0.40",
    "voyageai>=0.3",
    "cohere>=5.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "tenacity>=9.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    # PDF text extraction. Dual-licensed AGPL-3 / commercial — chosen for its
    # extraction quality on academic PDFs. See ingest plan for the license note.
    "pymupdf>=1.24",
    # Tokenizer used only as a size proxy for the fixed-window chunker. Voyage
    # doesn't publish a public tokenizer; cl100k_base is fast, offline, and
    # close enough for the "500 tokens, 50 overlap" spec.
    "tiktoken>=0.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
# RUF001 (in string literals) and RUF003 (in comments) flag ambiguous
# unicode characters — we use em-dashes ("—"), arrows ("→"), section marks
# ("§"), and multiplication signs ("×") throughout the repo. These are
# intentional and readable; suppressing repo-wide is cleaner than a
# `# noqa` per occurrence.
ignore = ["RUF001", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]
